  - name: application setup
    include_role:
      name: common
      tasks_from: app_setup
 
  - name: python setup
    include_role:
      name: common
      tasks_from: python

  - name: systemd setup
    include_role:
      name: common
      tasks_from: systemd-setup

  - name: restart application
    include_role:
      name: common
      tasks_from: restart